<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Verträge hier kündigen – Löschmeier Föhr</title>
    <style>
      :root {
        --bg: #0d1116;
        --card: #161b22;
        --border: #303844;
        --text: #edf3f8;
        --muted: #a8b4c0;
        --accent: #43b3ff;
        --ok: #52d18b;
        --bad: #ff7b72;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.55 system-ui,
          sans-serif;
      }
      main {
        width: min(680px, calc(100% - 32px));
        margin: auto;
        padding: 40px 0;
      }
      a {
        color: var(--accent);
      }
      form {
        padding: 24px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      label {
        display: block;
        margin-top: 14px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 11px;
        margin-top: 5px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
      }
      button {
        width: 100%;
        padding: 14px;
        margin-top: 20px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #071018;
        font-weight: 750;
        font-size: 16px;
      }
      .hint {
        color: var(--muted);
      }
      #result {
        display: none;
        white-space: pre-wrap;
        padding: 18px;
        margin-top: 20px;
        border: 1px solid var(--ok);
        border-radius: 10px;
      }
      .error {
        color: var(--bad);
      }
    </style>
  </head>
  <body>
    <main>
      <p><a href="/registrieren.html">← Zurück</a></p>
      <h1>Verträge hier kündigen</h1>
      <p class="hint">
        Ohne Anmeldung kündigen. Pflichtangaben dienen nur der eindeutigen
        Zuordnung. Direkt nach dem Absenden erhalten Sie eine Vorgangsnummer und
        einen speicherbaren Nachweis.
      </p>
      <form id="form">
        <label
          >Name<input
            name="name"
            autocomplete="name"
            required
            maxlength="160" /></label
        ><label
          >E-Mail-Adresse des Vertrags<input
            name="email"
            type="email"
            autocomplete="email"
            required /></label
        ><label
          >Vertragsnummer oder PayPal-Abo-ID<input
            name="vertragsreferenz"
            required
            maxlength="160"
            placeholder="z. B. LM-2026-…" /></label
        ><label
          >Vertrag<input
            name="vertragsbezeichnung"
            value="Löschmeier Föhr – Jahreszugang"
            required /></label
        ><label
          >Art der Kündigung<select name="erklaerungsart">
            <option value="ordentlich">
              Ordentlich zum nächstmöglichen Zeitpunkt
            </option>
            <option value="ausserordentlich">Außerordentlich</option>
          </select></label
        ><label
          >Gewünschtes Vertragsende (optional)<input
            name="gewuenschtes_ende"
            type="date" /></label
        ><label
          >Grund (bei außerordentlicher Kündigung empfohlen)<textarea
            name="grund"
            rows="4"
            maxlength="1000"
          ></textarea></label
        ><button type="submit">Jetzt kündigen</button>
      </form>
      <div id="result" role="status"></div>
    </main>
    <script>
      const WORKER_URL =
          "https://loeschmeier-abo-worker.joerg-roeloffs.workers.dev",
        form = document.getElementById("form"),
        result = document.getElementById("result");
      form.onsubmit = async (event) => {
        event.preventDefault();
        const values = Object.fromEntries(new FormData(form));
        result.style.display = "block";
        result.className = "";
        result.textContent = "Kündigung wird übermittelt …";
        try {
          const response = await fetch(
              WORKER_URL + "/api/kuendigung-erklaeren",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(values),
              },
            ),
            data = await response.json();
          if (!response.ok)
            throw new Error(data.fehler || "Übermittlung fehlgeschlagen");
          result.textContent = data.bestaetigung;
          const blob = new Blob([data.bestaetigung], {
              type: "text/plain;charset=utf-8",
            }),
            link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = `kuendigungsbestaetigung-${data.vorgangsnummer}.txt`;
          link.textContent = " Bestätigung herunterladen";
          result.append(document.createElement("br"), link);
          form.querySelector("button").disabled = true;
        } catch (error) {
          result.className = "error";
          result.textContent =
            "Die Kündigung konnte nicht übermittelt werden: " +
            error.message +
            ". Bitte alternativ per E-Mail an wasserentnahme-foehr@web.de senden.";
        }
      };
    </script>
  </body>
</html>
