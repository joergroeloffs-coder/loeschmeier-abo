<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Löschmeier Test — Kundenbereich</title>
<style>
  :root{
    --bg:#0d1116; --card:#161b22; --border:#2a313c;
    --text:#e6edf3; --muted:#93a3b3; --signal:#2fa4ff; --preis:#4fd18b; --fehler:#e0554a; --warnung:#e0a13a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:48px 20px;
  }
  header{text-align:center; margin-bottom:8px; max-width:440px}
  h1{font-size:26px; margin:0 0 8px; letter-spacing:-0.5px}
  p.sub{color:var(--muted); margin:0; font-size:15px; line-height:1.5}

  .karte{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:24px; width:100%; max-width:440px; margin-top:24px;
  }
  .karte h2{font-size:15px; margin:0 0 14px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em}

  .zeile{display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid var(--border); font-size:14px}
  .zeile:first-of-type{border-top:none}
  .zeile .label{color:var(--muted)}
  .zeile .wert{font-weight:600; text-align:right}

  .badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700}
  .badge.aktiv{background:#173a29; color:var(--preis)}
  .badge.warnung{background:#3a2f17; color:var(--warnung)}
  .badge.fehler{background:#3a1c1c; color:var(--fehler)}

  .geraet{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--border); font-size:14px}
  .geraet:first-of-type{border-top:none}

  button.btn{
    display:block; width:100%; margin-top:14px;
    background:var(--signal); color:#0d1116; text-align:center; border:0;
    padding:13px; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer;
  }
  button.btn.gefahr{background:transparent; color:var(--fehler); border:1px solid var(--fehler)}
  button.btn:disabled{opacity:0.5; cursor:default}

  .status{margin-top:14px; font-size:14px; padding:12px 14px; border-radius:8px; display:none}
  .status.on{display:block}
  .status.info{background:#1a2733; color:var(--text)}
  .status.fehler{background:#3a1c1c; color:var(--fehler)}
  .status.erfolg{background:#173a29; color:var(--preis)}

  a.zurueck{color:var(--muted); font-size:13px; text-decoration:none}
  footer{margin-top:32px; font-size:12px; color:var(--muted)}
</style>
</head>
<body>

<header>
  <h1>Kundenbereich</h1>
  <p class="sub" id="eingeloggt-als">Wird geladen ...</p>
</header>

<div class="karte" id="abo-karte" style="display:none">
  <h2>Dein Abo</h2>
  <div class="zeile"><span class="label">Tarif</span><span class="wert" id="w-tarif">–</span></div>
  <div class="zeile"><span class="label">Status</span><span class="wert" id="w-status">–</span></div>
  <div class="zeile"><span class="label">Beginn</span><span class="wert" id="w-beginn">–</span></div>
  <div class="zeile"><span class="label">Nächste Zahlung</span><span class="wert" id="w-naechste">–</span></div>
  <div class="zeile"><span class="label">Bezahlt bis</span><span class="wert" id="w-bezahlt-bis">–</span></div>
  <button class="btn gefahr" id="kuendigen-btn">Abo kündigen</button>
  <div class="status" id="abo-status"></div>
</div>

<div class="karte" id="geraete-karte" style="display:none">
  <h2>Angemeldete Geräte</h2>
  <div id="geraete-liste"></div>
</div>

<div class="karte" id="kein-abo-karte" style="display:none">
  <p class="sub">Noch kein Abo vorhanden.</p>
  <a class="btn" href="/registrieren.html" style="text-decoration:none; display:block; text-align:center">Jetzt abonnieren</a>
</div>

<a class="zurueck" href="/registrieren.html" style="margin-top:24px">← Zurück</a>
<footer>© Löschmeier Test</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://bmntahgtagjijfyeepju.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtbnRhaGd0YWdqaWpmeWVlcGp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4OTE2ODEsImV4cCI6MjEwNTQ2NzY4MX0.YzXfS98rli0PvIXmIyBAg9KJjcOW2NlXZq9fHzpcA0g";
  const WORKER_URL = "https://loeschmeier-abo-worker.joerg-roeloffs.workers.dev";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const STATUS_TEXT = {
    unbezahlt: ["Noch nicht bezahlt", "warnung"],
    wird_geprueft: ["Zahlung wird geprüft", "warnung"],
    aktiv: ["Aktiv", "aktiv"],
    ueberfaellig: ["Zahlung überfällig", "fehler"],
    kulanzzeit: ["Kulanzzeit — bitte Zahlungsmethode prüfen", "warnung"],
    gekuendigt_zum_ende: ["Gekündigt, läuft bis Vertragsende", "warnung"],
    gesperrt: ["Gesperrt", "fehler"],
    abgelaufen: ["Abgelaufen", "fehler"],
    erstattet: ["Erstattet", "fehler"],
    manuell_gesperrt: ["Gesperrt", "fehler"],
  };

  function formatDatum(iso){
    if(!iso) return "–";
    return new Date(iso).toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" });
  }

  function zeigeStatus(el, text, art){
    el.textContent = text;
    el.className = "status on " + art;
  }

  async function laden(){
    const { data: { session } } = await sb.auth.getSession();
    if(!session){
      document.getElementById("eingeloggt-als").textContent = "Nicht angemeldet — bitte zuerst über die Registrierungsseite anmelden.";
      return;
    }
    document.getElementById("eingeloggt-als").textContent = session.user.email;

    // customer_profiles und subscriptions sind per RLS auf den eigenen
    // Datensatz beschraenkt - direktes Lesen ueber den anon-Key ist hier
    // sicher (kein Worker-Umweg noetig).
    const headers = {
      apikey: SUPABASE_ANON_KEY,
      Authorization: "Bearer " + session.access_token,
    };

    const profilRes = await fetch(
      `${SUPABASE_URL}/rest/v1/customer_profiles?select=id&auth_user_id=eq.${session.user.id}`,
      { headers }
    );
    const profile = await profilRes.json();
    if(!profile.length){
      document.getElementById("kein-abo-karte").style.display = "block";
      return;
    }

    const aboRes = await fetch(
      `${SUPABASE_URL}/rest/v1/subscriptions?select=*,tariffs(bezeichnung)&customer_id=eq.${profile[0].id}&order=erstellt_am.desc&limit=1`,
      { headers }
    );
    const abos = await aboRes.json();
    if(!abos.length){
      document.getElementById("kein-abo-karte").style.display = "block";
      return;
    }
    const abo = abos[0];

    document.getElementById("abo-karte").style.display = "block";
    document.getElementById("w-tarif").textContent = abo.tariffs?.bezeichnung || "–";
    const [text, art] = STATUS_TEXT[abo.status] || [abo.status, "warnung"];
    document.getElementById("w-status").innerHTML = `<span class="badge ${art}">${text}</span>`;
    document.getElementById("w-beginn").textContent = formatDatum(abo.beginn);
    document.getElementById("w-naechste").textContent = formatDatum(abo.naechste_zahlung);
    document.getElementById("w-bezahlt-bis").textContent = formatDatum(abo.bezahlt_bis);

    if(abo.status !== "aktiv"){
      document.getElementById("kuendigen-btn").disabled = true;
    }
    if(abo.status === "gekuendigt_zum_ende"){
      document.getElementById("kuendigen-btn").style.display = "none";
    }

    // Geraete laden
    const geraeteRes = await fetch(
      `${SUPABASE_URL}/rest/v1/devices?select=*&customer_id=eq.${profile[0].id}&order=zuletzt_aktiv.desc`,
      { headers }
    );
    const geraete = await geraeteRes.json();
    const liste = document.getElementById("geraete-liste");
    if(geraete.length === 0){
      liste.innerHTML = '<p class="sub" style="margin:0">Noch kein Gerät registriert.</p>';
    } else {
      liste.innerHTML = geraete.map(g => `
        <div class="geraet">
          <span>
            <span style="display:block">${g.geraet_name || "Unbekanntes Gerät"}</span>
            <span class="sub">zuletzt aktiv: ${formatDatum(g.zuletzt_aktiv)}</span>
          </span>
          <button class="btn gefahr" style="width:auto;margin:0;padding:8px 12px;font-size:12px" onclick="geraetEntfernen('${g.id}')">Entfernen</button>
        </div>
      `).join("");
    }
    document.getElementById("geraete-karte").style.display = "block";
  }

  async function geraetEntfernen(deviceId){
    if(!confirm("Dieses Gerät wirklich entfernen? Es kann sich danach nicht mehr ohne erneute Prüfung anmelden.")) return;

    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch(WORKER_URL + "/api/geraet-entfernen", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + session.access_token,
      },
      body: JSON.stringify({ device_id: deviceId }),
    });
    if(res.ok){
      laden();
    } else {
      alert("Gerät konnte nicht entfernt werden.");
    }
  }

  document.getElementById("kuendigen-btn").addEventListener("click", async () => {
    if(!confirm("Abo wirklich kündigen? Der Zugang bleibt bis zum Ende des bereits bezahlten Zeitraums bestehen.")) return;

    const statusEl = document.getElementById("abo-status");
    zeigeStatus(statusEl, "Kündigung wird verarbeitet ...", "info");

    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch(WORKER_URL + "/api/kuendigen", {
      method: "POST",
      headers: { Authorization: "Bearer " + session.access_token },
    });
    const daten = await res.json();
    if(res.ok){
      zeigeStatus(statusEl, "Gekündigt. Zugang bleibt bestehen bis: " + formatDatum(daten.wirksam_zum), "erfolg");
      setTimeout(laden, 1500);
    } else {
      zeigeStatus(statusEl, "Fehler bei der Kündigung: " + (daten.fehler || "unbekannt"), "fehler");
    }
  });

  laden();
</script>

</body>
</html>
