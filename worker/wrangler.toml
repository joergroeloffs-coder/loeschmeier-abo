# Adresse der oeffentlichen Seiten. Steht in allen Vertrags-, Kuendigungs- und
# Widerrufsbestaetigungen. Beim Domainwechsel nur hier aendern.
OEFFENTLICHE_BASIS_URL = "https://test.roewise.com"

# Empfaenger fuer Betreiber-Benachrichtigungen (eingegangene Kuendigungen und
# Widerrufe, besonders die Faelle mit "manuell_pruefen").
BETREIBER_EMAIL = "wasserentnahme-foehr@web.de"

# Konten mit Zugang zu den internen Bereichen (Datenpflege, nutzer-admin).
# Kommagetrennte Anmelde-E-Mail-Adressen. MUSS gesetzt sein, bevor die
# geschuetzten Seiten veroeffentlicht werden - sonst sperrt sich der Betrieb
# aus den eigenen Werkzeugen aus.
#
# ABSICHTLICH NICHT HIER EINGETRAGEN: Der Wert steht im Cloudflare-Dashboard.
# Eine E-Mail-Adresse waere in diesem oeffentlichen Repository fuer jeden
# lesbar. Ausserdem wuerde ein leerer Wert an dieser Stelle bei einem Deploy
# per wrangler den Dashboard-Wert ueberschreiben und den Betrieb aussperren.
# BETREIBER_AUTH_EMAILS = "adresse@example.de"

# Zusaetzlich erlaubte Aufrufer (CORS), kommagetrennt. Die eigenen Domains
# stehen bereits fest im Worker-Code.
ERLAUBTE_URSPRUENGE = ""

# Quelle fuer /api/stellen. Erst setzen, wenn die Stellendaten NICHT mehr
# oeffentlich als statische Datei ausgeliefert werden - sonst bleibt der
# Schutz wirkungslos (siehe INTEGRATION_LOESCHBAERT.md).
# STELLEN_QUELLE_URL = "https://<privater-speicherort>/stellen.geojson"

# Geheime Werte NICHT hier eintragen. Stattdessen im Cloudflare-Dashboard:
# Worker -> Settings -> Variables and Secrets -> "Add" -> Typ "Secret":
#   SUPABASE_SERVICE_ROLE_KEY   (Supabase -> Project Settings -> API -> service_role)
#   PAYPAL_SECRET               (PayPal Developer -> App -> Secret)
#   PAYPAL_WEBHOOK_ID           (wird bei der Webhook-Einrichtung vergeben, s. unten)
#   RESEND_API_KEY              (Resend -> API Keys)
#   ADMIN_PASSWORT              (frei gewaehltes langes Passwort)
#   STELLEN_QUELLE_TOKEN        (nur falls die Stellenquelle ein Token braucht)
# SALES_ENABLED erst nach Migration, Jahresplan, Webhook- und E-Mail-Test auf
# "true" stellen. Bis dahin zeigt die Seite das Angebot ohne Kaufmöglichkeit.

# Taeglicher Abgleich mit PayPal (faengt ausgefallene Webhooks ab)
[triggers]
crons = ["0 3 * * *"]

# KV-Namespace fuer Rate Limiting des Admin-Logins. Die ID einmalig aus dem
# Cloudflare-Dashboard eintragen (Workers & Pages -> KV -> Namespace RATE_KV
# oeffnen), dann die folgenden zwei Zeilen einkommentieren. Erst danach
# funktioniert der automatische Deploy (npm run deploy in worker/) - siehe
# deploy.mjs, das ohne diesen Eintrag bewusst abbricht, statt die im
# Dashboard bestehende Bindung stillschweigend zu entfernen.
[[kv_namespaces]]
binding = "RATE_KV"
id = "972356190d3341168b7b28458513e224"
